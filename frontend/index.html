<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M22 12h-4l-3 9L9 3l-3 9H2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090e17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>MedTech AI - Hospital & Clinical Operating System</title>
    <meta name="description" content="Next-generation intelligent clinical hospital management, AI symptom triage, bed telemetry, live OPD queue, and paperless electronic medical records." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#090e17;color:#f8fafc;font-family:'Plus Jakarta Sans',system-ui,sans-serif;text-align:center;padding:20px;">
        <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#06b6d4,#3b82f6);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(6,182,212,0.4);margin-bottom:20px;animation:preloaderPulse 1.5s ease-in-out infinite alternate;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        </div>
        <div style="font-size:1.15rem;font-weight:700;letter-spacing:-0.01em;margin-bottom:6px;color:#f8fafc;">
          MedTech AI
        </div>
        <div style="font-size:0.82rem;color:#94a3b8;margin-bottom:18px;">
          Clinical Hospital OS चालू होत आहे...
        </div>
        <div id="preloader-recovery" style="display:none;margin-top:14px;animation:fadeIn 0.3s ease;">
          <p style="font-size:0.8rem;color:#f59e0b;margin-bottom:12px;">
            लोड होण्यास वेळ लागत असल्यास किंवा स्क्रीन अडकल्यास:
          </p>
          <button onclick="localStorage.clear();sessionStorage.clear();window.location.reload(true);" style="background:rgba(6,182,212,0.15);border:1px solid rgba(6,182,212,0.4);color:#38bdf8;padding:8px 16px;border-radius:8px;font-size:0.82rem;font-weight:600;cursor:pointer;">
            कॅशे क्लिअर करून रीस्टार्ट करा (Reset & Reload)
          </button>
        </div>
      </div>
    </div>
    <style>
      @keyframes preloaderPulse {
        from { transform: scale(0.96); box-shadow: 0 0 20px rgba(6,182,212,0.25); }
        to { transform: scale(1.06); box-shadow: 0 0 35px rgba(6,182,212,0.55); }
      }
    </style>
    <script>
      // Show recovery button if React doesn't mount within 4 seconds
      setTimeout(function() {
        var rec = document.getElementById('preloader-recovery');
        if (rec) rec.style.display = 'block';
      }, 4000);
      // Catch unhandled script load errors
      window.addEventListener('error', function(e) {
        console.error('Global script error:', e);
        var rec = document.getElementById('preloader-recovery');
        if (rec) rec.style.display = 'block';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
